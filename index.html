<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bubble 动态演示与边播边讲</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23324d;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --bubble-color: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 顶部导航与模式切换 */
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(19, 28, 46, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    .badge {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* 模式切换器 */
    .mode-switch {
      display: flex;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      border: 1px solid var(--border);
    }

    /* 主内容区 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      gap: 14px;
    }

    /* 舞台视窗 */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-height: 290px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* 冒泡排序画布 */
    .sort-stage {
      height: 230px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      position: relative;
      padding-bottom: 10px;
    }

    .sort-item {
      flex: 1;
      max-width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bar {
      width: 100%;
      background: #0284c7;
      border-radius: 8px 8px 3px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: all 0.3s ease;
    }

    .sort-item.comparing .bar {
      background: var(--warning);
      color: #0f172a;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.6);
      transform: scaleY(1.05);
    }

    .sort-item.swapping .bar {
      background: var(--danger);
      box-shadow: 0 0 20px rgba(248, 113, 113, 0.8);
      transform: scale(1.08);
    }

    .sort-item.sorted .bar {
      background: var(--success);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
    }

    .item-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 缓存冒泡 (Bubble Cache) 视图 */
    .cache-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 250px;
      position: relative;
    }

    .tree-level {
      display: flex;
      justify-content: center;
      width: 100%;
      gap: 12px;
      z-index: 2;
    }

    .tree-node {
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .tree-node.active-node {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      background: #1e293b;
    }

    .tree-node.updated-node {
      border-color: var(--success);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
    }

    .node-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .node-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* 冒泡气泡动画 */
    .floating-bubble {
      position: absolute;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.6);
      pointer-events: none;
      z-index: 10;
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      transform: translateY(0) scale(0.6);
    }

    .floating-bubble.animate-up {
      opacity: 1;
      transform: translateY(-80px) scale(1.1);
    }

    /* 边演示边讲解说明卡片 (Narration Panel) */
    .narration-card {
      background: var(--card-bg);
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: pulseBorder 3s infinite ease-in-out;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(56, 189, 248, 0.4); }
      50% { border-color: rgba(56, 189, 248, 0.9); }
    }

    .narration-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .step-pill {
      background: var(--accent);
      color: #090d16;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .voice-btn {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .voice-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .voice-select {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      max-width: 220px;
      cursor: pointer;
      outline: none;
    }

    .voice-select:focus {
      border-color: var(--accent);
    }

    .narration-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      color: #f1f5f9;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    .narration-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.08);
    }

    /* 播放控制栏 */
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--accent);
      color: #090d16;
      border: none;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .speed-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .speed-btns {
      display: flex;
      gap: 6px;
    }

    .speed-btn {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .speed-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    /* 手机端特别优化 */
    @media (max-width: 600px) {
      main {
        padding: 10px;
        gap: 10px;
      }
      .stage-card {
        min-height: 250px;
        padding: 12px;
      }
      .sort-stage {
        height: 190px;
        gap: 6px;
      }
      .bar {
        font-size: 0.88rem;
      }
      .narration-text {
        font-size: 0.95rem;
      }
      .btn {
        padding: 9px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="logo">
        <span>🫧 动态演示与同步说明</span>
        <span class="badge">实时解说</span>
      </div>
    </div>
    
    <!-- 演示模式快速切换 -->
    <div class="mode-switch">
      <button class="mode-btn active" id="btnModeSort" onclick="switchMode('sort')">
        📊 冒泡排序 (Bubble Sort)
      </button>
      <button class="mode-btn" id="btnModeCache" onclick="switchMode('cache')">
        🧬 缓存冒泡 (Bubble Cache)
      </button>
    </div>
  </header>

  <main>
    <!-- 动画展示舞台 -->
    <div class="stage-card">
      <div class="stage-header">
        <span id="stageTitle">📊 冒泡排序实时演算</span>
        <span id="stageStatus">就绪 — 点击“开始演示”</span>
      </div>

      <!-- 模式 1: 冒泡排序视图 -->
      <div class="sort-stage" id="sortStage">
        <!-- 动态生成的排序列 -->
      </div>

      <!-- 模式 2: 缓存冒泡视图 -->
      <div class="cache-stage" id="cacheStage">
        <!-- 顶层页面缓存 -->
        <div class="tree-level">
          <div class="tree-node" id="nodeRoot" style="min-width: 220px;">
            <div class="node-title">🌐 顶层页面缓存 (Page Cache)</div>
            <div class="node-meta" id="rootMeta">等待子组件元数据冒泡汇聚...</div>
          </div>
        </div>

        <!-- 浮动气泡容器 -->
        <div id="bubbleContainer"></div>

        <!-- 中间层容器 -->
        <div class="tree-level">
          <div class="tree-node" id="nodeMid">
            <div class="node-title">📦 内容容器 (Container)</div>
            <div class="node-meta" id="midMeta">继承子组件缓存约束</div>
          </div>
        </div>

        <!-- 底层微组件 -->
        <div class="tree-level">
          <div class="tree-node" id="leafUser">
            <div class="node-title">👤 用户资料组件</div>
            <div class="node-meta">Tag: <code>user:101</code> (60s)</div>
          </div>
          <div class="tree-node" id="leafArticle">
            <div class="node-title">📰 文章正文组件</div>
            <div class="node-meta">Tag: <code>post:88</code> (3600s)</div>
          </div>
          <div class="tree-node" id="leafComments">
            <div class="node-title">💬 评论列表组件</div>
            <div class="node-meta">Tag: <code>comm:88</code> (10s)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 边演示边讲解解说卡片 (核心特色) -->
    <div class="narration-card">
      <div class="narration-header">
        <span class="step-pill" id="stepPill">步骤 1 / 15</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <select class="voice-select" id="voiceSelect" title="选择朗读音色" onchange="onVoiceChange(this)"></select>
          <button class="voice-btn" id="voiceToggle" onclick="toggleVoice()">
            🔊 语音播报：<span id="voiceStatus">开启</span>
          </button>
        </div>
      </div>
      <div class="narration-text" id="narrationText">
        准备就绪，点击“开始演示”按钮播放（含语音解说）。
      </div>
      <div class="narration-sub" id="narrationSub">
        💡 说明：黄色代表比对，红色代表位置互换，绿色代表已沉底就位。
      </div>
    </div>

    <!-- 播放与单步控制栏 -->
    <div class="controls-card">
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="prevStep()">⏮ 上一步</button>
        <button class="btn" id="playBtn" onclick="togglePlay()">▶ 开始演示</button>
        <button class="btn btn-secondary" onclick="nextStep()">⏭ 下一步</button>
        <button class="btn btn-secondary" onclick="restart()">🔄 重新开始</button>
      </div>

      <div class="speed-control">
        <span>演示速率：</span>
        <div class="speed-btns">
          <button class="speed-btn" onclick="setSpeed(1800, this)">0.5x 慢速</button>
          <button class="speed-btn active" onclick="setSpeed(1000, this)">1.0x 标准</button>
          <button class="speed-btn" onclick="setSpeed(500, this)">2.0x 快速</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 状态定义
    let currentMode = 'sort'; // 'sort' | 'cache'
    let isPlaying = false;
    let timer = null;
    let stepDelay = 1000;
    let voiceEnabled = true;
    let voiceList = [];
    let currentVoice = null;
    // 浏览器自动播放策略：首次用户交互前禁止语音，交互后解锁
    let speechUnlocked = false;

    function unlockSpeech() {
      if (speechUnlocked) return;
      speechUnlocked = true;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
      }
    }
    document.addEventListener('pointerdown', unlockSpeech);
    document.addEventListener('keydown', unlockSpeech);

    /* ========================================================
       1. 冒泡排序 (Bubble Sort) 演示逻辑
       ======================================================== */
    const sortInitArray = [68, 25, 82, 45, 12, 55];
    let sortSteps = [];
    let sortCurrentStepIdx = 0;

    // 预先生成所有比较与交换的动画帧
    function generateSortSteps(arr) {
      let a = [...arr];
      let steps = [];
      let n = a.length;

      steps.push({
        type: 'INIT',
        array: [...a],
        comparing: [],
        swapping: [],
        sorted: [],
        text: `这是我们要排序的数组：${a.join('、')}。接下来会从左往右，反复比较相邻的两个数。`,
        sub: '核心规律很简单：大的数会像水里的气泡一样，一点一点浮到最右边去。'
      });

      for (let i = 0; i < n - 1; i++) {
        let swappedInPass = false;
        steps.push({
          type: 'PASS_START',
          array: [...a],
          comparing: [],
          swapping: [],
          sorted: Array.from({length: i}, (_, k) => n - 1 - k),
          text: `第 ${i + 1} 轮开始。这一轮的任务，是把还没排好的数里最大的那个，一路推到最右边。`,
          sub: `现在还没确定位置的，是前面这 ${n - i} 个数。`
        });

        for (let j = 0; j < n - 1 - i; j++) {
          // 比对步骤
          const valA = a[j];
          const valB = a[j + 1];

          if (valA > valB) {
            steps.push({
              type: 'COMPARE_SWAP',
              array: [...a],
              comparing: [j, j + 1],
              swapping: [],
              sorted: Array.from({length: i}, (_, k) => n - 1 - k),
              text: `来看 ${valA} 和 ${valB}。${valA} 比较大，却排在前面，顺序反了，得交换一下。`,
              sub: '只要前面比后面大，就交换位置——这是冒泡排序唯一要做的事情。'
            });

            // 交换
            [a[j], a[j + 1]] = [a[j + 1], a[j]];
            swappedInPass = true;

            steps.push({
              type: 'DO_SWAP',
              array: [...a],
              comparing: [],
              swapping: [j, j + 1],
              sorted: Array.from({length: i}, (_, k) => n - 1 - k),
              text: `交换完成，${valA} 往右挪了一位。`,
              sub: '就像大气泡越过小气泡，继续向右浮过去。'
            });
          } else {
            steps.push({
              type: 'COMPARE_OK',
              array: [...a],
              comparing: [j, j + 1],
              swapping: [],
              sorted: Array.from({length: i}, (_, k) => n - 1 - k),
              text: `来看 ${valA} 和 ${valB}。${valA} 不大于 ${valB}，顺序本来就是对的，不用动。`,
              sub: '这一对不用交换，继续看下一对邻居。'
            });
          }
        }

        // 锁定当前轮次的最大值
        steps.push({
          type: 'LOCK',
          array: [...a],
          comparing: [],
          swapping: [],
          sorted: Array.from({length: i + 1}, (_, k) => n - 1 - k),
          text: `这一轮结束，${a[n - 1 - i]} 已经到达它的最终位置，安顿好了。`,
          sub: `最右边这 ${i + 1} 个数已经排好，后面的轮次就不用再碰它们了。`
        });

        if (!swappedInPass) {
          steps.push({
            type: 'EARLY_EXIT',
            array: [...a],
            comparing: [],
            swapping: [],
            sorted: Array.from({length: n}, (_, k) => k),
            text: '这一整轮走下来，一次交换都没有发生。这说明数组已经完全排好了，可以提前收工。',
            sub: '这就是提前退出优化：最好情况下，只需要 O(n) 的时间就能确认有序。'
          });
          break;
        }
      }

      steps.push({
        type: 'FINISH',
        array: [...a],
        comparing: [],
        swapping: [],
        sorted: Array.from({length: n}, (_, k) => k),
        text: '排序完成！所有数字都按从小到大的顺序排好了。',
        sub: '总结一下：冒泡排序的时间复杂度，最好是 O(n)，最坏是 O(n²)；它是原地排序，只多用 O(1) 的空间。'
      });

      return steps;
    }

    function renderSortStage(step) {
      const stage = document.getElementById('sortStage');
      stage.innerHTML = '';

      step.array.forEach((val, idx) => {
        const item = document.createElement('div');
        item.className = 'sort-item';

        if (step.comparing.includes(idx)) item.classList.add('comparing');
        if (step.swapping.includes(idx)) item.classList.add('swapping');
        if (step.sorted.includes(idx)) item.classList.add('sorted');

        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${val * 2.2}px`;
        bar.textContent = val;

        const label = document.createElement('div');
        label.className = 'item-label';
        label.textContent = `#${idx}`;

        item.appendChild(bar);
        item.appendChild(label);
        stage.appendChild(item);
      });
    }

    /* ========================================================
       2. 缓存冒泡 (Bubble Cache / Cache Bubbling) 演示逻辑
       ======================================================== */
    const cacheSteps = [
      {
        step: 1,
        activeNode: 'leafUser',
        bubbleText: 'Tag: user:101 (TTL 60s)',
        text: '先看用户资料组件。它生成了自己的缓存标签 user:101，缓存时间是 60 秒。',
        sub: '在微前端或复杂的内容管理系统里，每个底层小组件都有自己的一套缓存规则。',
        rootText: '尚未接收子组件依赖...',
        midText: '等待子级冒泡...'
      },
      {
        step: 2,
        activeNode: 'leafArticle',
        bubbleText: 'Tag: post:88 (TTL 3600s)',
        text: '接着是文章正文组件，标签是 post:88。文章内容不常更新，所以可以缓存很久：3600 秒。',
        sub: '静态文章和动态用户信息的缓存时效差别很大，需要一套自下而上的汇总规则。',
        rootText: '尚未接收子组件依赖...',
        midText: '等待子级冒泡...'
      },
      {
        step: 3,
        activeNode: 'leafComments',
        bubbleText: 'Tag: comm:88 (TTL 10s)',
        text: '评论区的更新最频繁，标签是 comm:88，只能缓存 10 秒。',
        sub: '评论对时效的要求最高，它会直接限制上层容器能用多长的缓存时间。',
        rootText: '尚未接收子组件依赖...',
        midText: '等待子级冒泡...'
      },
      {
        step: 4,
        activeNode: 'nodeMid',
        bubbleText: '🫧 冒泡汇总中...',
        text: '现在，三个子组件的标签开始向上冒泡，汇总到父容器。',
        sub: '容器按木桶原理取最短的缓存时间：60、3600、10 里最小的那个，也就是 10 秒，同时收集所有标签。',
        rootText: '等待容器向顶层冒泡...',
        midText: '聚合：Tags [user:101, post:88, comm:88] | TTL: 10s'
      },
      {
        step: 5,
        activeNode: 'nodeRoot',
        bubbleText: '🚀 顶层缓存锁定',
        text: '标签继续冒泡到顶层，整页缓存就建立好了。',
        sub: '以后任何子组件有更新，比如来了新评论，只要让对应的 comm:88 标签失效就行。',
        rootText: '✅ 缓存就绪 | 关联 Tags: 3 个 | 最低 TTL: 10s',
        midText: '聚合：Tags [user:101, post:88, comm:88] | TTL: 10s'
      },
      {
        step: 6,
        activeNode: 'nodeRoot',
        bubbleText: '🎯 精准失效演示',
        text: '来演示一下精准失效：当有新评论时，系统只让 comm:88 失效，整页缓存立刻就能感知到变化。',
        sub: '这就是缓存冒泡最大的优势：局部的小改动，就能联动全局缓存，不用全部清空重来。',
        rootText: '⚡ 接收到失效信号，快速重建！',
        midText: '已更新'
      }
    ];
    let cacheCurrentStepIdx = 0;

    function renderCacheStage(step) {
      document.querySelectorAll('.tree-node').forEach(n => {
        n.classList.remove('active-node', 'updated-node');
      });

      const activeEl = document.getElementById(step.activeNode);
      if (activeEl) activeEl.classList.add('active-node');

      document.getElementById('rootMeta').textContent = step.rootText;
      document.getElementById('midMeta').textContent = step.midText;

      // 气泡动画
      const container = document.getElementById('bubbleContainer');
      container.innerHTML = '';
      if (step.bubbleText) {
        const bubble = document.createElement('div');
        bubble.className = 'floating-bubble animate-up';
        bubble.textContent = step.bubbleText;
        bubble.style.top = '140px';
        bubble.style.left = '45%';
        container.appendChild(bubble);
      }
    }

    /* ========================================================
       3. 边演示边讲解引擎 (Narration & Audio)
       ======================================================== */
    function refreshVoices() {
      if (!('speechSynthesis' in window)) return;
      const all = window.speechSynthesis.getVoices();
      // 优先中文音色；若没有中文音色则退回全部音色
      voiceList = all.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith('zh'));
      if (voiceList.length === 0) voiceList = all;

      const savedURI = localStorage.getItem('bubbleVoiceURI');
      const saved = savedURI && voiceList.find(v => v.voiceURI === savedURI);
      currentVoice = saved || pickNaturalVoice(voiceList);
      populateVoiceSelect();
    }

    // 按“更像真人”的优先级自动挑选音色
    function pickNaturalVoice(list) {
      const preferred = [
        /xiaoxiao|yunxi|yunjian|xiaoyi|yunxia/i, // 微软神经网络中文音色（Edge）
        /natural|neural|online/i,                // 其他自然/在线音色
        /tingting|ting-ting|meijia|mei-jia/i,    // macOS 优质中文音色
        /siri|enhanced|premium/i                 // iOS/macOS 高质音色
      ];
      for (const re of preferred) {
        const v = list.find(v => re.test(v.name) || re.test(v.voiceURI));
        if (v) return v;
      }
      return list.find(v => /zh[-_]CN/i.test(v.lang)) || list[0] || null;
    }

    function populateVoiceSelect() {
      const sel = document.getElementById('voiceSelect');
      if (!sel) return;
      sel.innerHTML = '';
      if (voiceList.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '系统默认语音';
        sel.appendChild(opt);
        return;
      }
      voiceList.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = v.name;
        sel.appendChild(opt);
      });
      if (currentVoice) sel.value = currentVoice.voiceURI;
    }

    function onVoiceChange(selEl) {
      const v = voiceList.find(v => v.voiceURI === selEl.value);
      if (!v) return;
      currentVoice = v;
      localStorage.setItem('bubbleVoiceURI', v.voiceURI);
      applyCurrentStep(); // 用新音色重读当前步骤
    }

    function speakText(text) {
      if (!voiceEnabled || !speechUnlocked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止上一句

      // 去除可能残留的表情符号
      const clean = text.replace(/[📊🧬👤📰💬🌐📦💡🎉🚀⚡🫧🎯✅]/g, '');
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'zh-CN';
      if (currentVoice) utterance.voice = currentVoice;
      utterance.rate = 1.0;  // 自然语速
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function updateNarration(title, text, sub, currentIdx, totalSteps) {
      document.getElementById('stepPill').textContent = `步骤 ${currentIdx + 1} / ${totalSteps}`;
      document.getElementById('narrationText').textContent = text;
      document.getElementById('narrationSub').textContent = sub;

      speakText(text);
    }

    /* ========================================================
       4. 调度与播放器控制
       ======================================================== */
    function applyCurrentStep() {
      if (currentMode === 'sort') {
        const step = sortSteps[sortCurrentStepIdx];
        renderSortStage(step);
        updateNarration(
          '冒泡排序',
          step.text,
          step.sub,
          sortCurrentStepIdx,
          sortSteps.length
        );
      } else {
        const step = cacheSteps[cacheCurrentStepIdx];
        renderCacheStage(step);
        updateNarration(
          '缓存冒泡',
          step.text,
          step.sub,
          cacheCurrentStepIdx,
          cacheSteps.length
        );
      }
    }

    function stepForward() {
      if (currentMode === 'sort') {
        if (sortCurrentStepIdx < sortSteps.length - 1) {
          sortCurrentStepIdx++;
          applyCurrentStep();
        } else {
          pause();
          document.getElementById('stageStatus').textContent = '演示结束，点击“重新开始”';
        }
      } else {
        if (cacheCurrentStepIdx < cacheSteps.length - 1) {
          cacheCurrentStepIdx++;
          applyCurrentStep();
        } else {
          pause();
          document.getElementById('stageStatus').textContent = '演示结束，点击“重新开始”';
        }
      }
    }

    function stepBackward() {
      if (currentMode === 'sort') {
        if (sortCurrentStepIdx > 0) {
          sortCurrentStepIdx--;
          applyCurrentStep();
        }
      } else {
        if (cacheCurrentStepIdx > 0) {
          cacheCurrentStepIdx--;
          applyCurrentStep();
        }
      }
    }

    function play() {
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      document.getElementById('stageStatus').textContent = '自动演示中...';
      if (timer) clearInterval(timer);
      timer = setInterval(stepForward, stepDelay);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 继续';
      document.getElementById('stageStatus').textContent = '已暂停';
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        applyCurrentStep(); // 立即朗读当前步骤
        play();
      }
    }

    function nextStep() {
      pause();
      stepForward();
    }

    function prevStep() {
      pause();
      stepBackward();
    }

    function restart() {
      pause();
      if (currentMode === 'sort') {
        sortCurrentStepIdx = 0;
      } else {
        cacheCurrentStepIdx = 0;
      }
      applyCurrentStep();
      play();
    }

    function setSpeed(ms, btnEl) {
      stepDelay = ms;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      if (isPlaying) {
        play(); // 重启定时器应用新速度
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const statusEl = document.getElementById('voiceStatus');
      const btn = document.getElementById('voiceToggle');
      if (voiceEnabled) {
        statusEl.textContent = '开启';
        btn.classList.add('active');
        applyCurrentStep();
      } else {
        statusEl.textContent = '静音';
        btn.classList.remove('active');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    /* ========================================================
       5. 模式切换 (Sort vs Cache)
       ======================================================== */
    function switchMode(mode) {
      currentMode = mode;
      pause();

      const btnSort = document.getElementById('btnModeSort');
      const btnCache = document.getElementById('btnModeCache');
      const sortStage = document.getElementById('sortStage');
      const cacheStage = document.getElementById('cacheStage');
      const stageTitle = document.getElementById('stageTitle');

      if (mode === 'sort') {
        btnSort.classList.add('active');
        btnCache.classList.remove('active');
        sortStage.style.display = 'flex';
        cacheStage.style.display = 'none';
        stageTitle.textContent = '📊 冒泡排序 (Bubble Sort) 动态演算';
        sortCurrentStepIdx = 0;
      } else {
        btnCache.classList.add('active');
        btnSort.classList.remove('active');
        sortStage.style.display = 'none';
        cacheStage.style.display = 'flex';
        stageTitle.textContent = '🧬 缓存冒泡 (Bubble Cache) 机制演示';
        cacheCurrentStepIdx = 0;
      }

      applyCurrentStep();
      play();
    }

    // 初始化启动（默认暂停，等待用户点击“开始演示”以解锁语音）
    sortSteps = generateSortSteps(sortInitArray);
    refreshVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }
    applyCurrentStep();
  </script>
</body>
